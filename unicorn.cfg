#### Game mode
#### Epic   = epic
#### Heroic = heroic
#### Normal = normal
#### Casual = casual
#### Default: Normal
#Epic
#Heroic
#Normal
#Casual

#### Dungeon depth
#### Depth=<depth> - Set maximum dungeon depth the 'depth', must be between 2 and 10
#### Default: Depth=5
#Depth=10

#### Auto pickup torches
#### AutoPickupTorch   = Pick up torches automatically when you walk over them
#### NoAutoPickupTorch = Do not automatically pick up torches
#### Default: NoAutoPickupTorch
#AutoPickupTorch
#NoAutoPickupTorch

#### Auto pickup gold
#### AutoPickupGold   = Pick up gold automatically when you walk over it
#### NoAutoPickupGold = Do not pick up gold automatically
#### Default: NoAutoPickupGold
#AutoPickupGold
#NoAutoPickupGold

#### Auto Open Doors
#### AutoOpenDoors   = Automatically open a door if you bump into it
#### NoAutoOpenDoors = Do not automatically open doors
#### Default: NoAutoOpenDoors
#AutoOpenDoors
#NoAutoOpenDoors

#### Auto Search Walls
#### AutoSearchWalls   = Perform a <s>earch when bumping into a wall
#### NoAutoSearchWalls = Do not auto perform <s>earch when bumping into walls
#### Default: NoAutoSearchWalls
#AutoSearchWalls
#NoAutoSearchWalls

#### Multi-monster Arena Combat
#### ArenaCombat    = Turn on multi-monster arena combats in higher levels
#### NoArenaComabet = Never allow multi-monster combat except for bosses
#### Default: NoArenaCombat
#ArenaCombat
#NoArenaCombat

#### Enable Dungeon Scaling
#### DungeonScaling   = Monsters in dungeons will scale to your level
#### NoDungeonScaling = Monsters in dungeons will be the level of the dungeon
#### Default: NoDungeonScaling
#DungeonScaling
#NoDungeonScaling

#### Monster Count
#### MounsterCount=<count> = Specifies number of mobs that can spawn on a level
####                         between 10 and 60
#### Default: MounsterCount=60
#MounsterCount=60

#### Party Combat Mode
#### FullPartyCombat   = Monsters and party members take full damage from each other
#### NoFullPartyCombat = Monsters and party members take reduced damage from each other
#### Default: NoFullPartyCombat
#FullPartyCombat
#NoFullPartyCombat

#### Delay for trap effects
#### DelayTraps=<milliseconds> = Set delay time for showing effects from traps
#### Default: DelayTraps=100
#DelayTraps=100

#### Delay for Ranged flight
#### DelayRanged=<milliseconds> = Set delay for ranged attack flight
#### Default: DelayRanged=5
#DelayRanged=5

#### Delay for sucessful hit
#### DelayHit=<milliseconds> = Set delay for successful hit effect
#### Default: DelayHit=200
#DelayHit=200

#### Auto target mode
#### AutoTarget   = Turn on auto target mode
#### NoAutoTarget = Turn off auto target mode
#### Default: AutoTarget
#AutoTarget
#NoAutoTarget

##### Text Mode (Text mode only)
##### Monochrome - Run in monochrome
##### Color      - Run in color
##### Default: Color
#Color
#monochrome

##### Window Width (Graphics mode only)
##### Width=<width> - Width of window in pixels.  Minimum 640
##### Default: Width=640
#Width=640

##### Window Height (Graphics mode only)
##### Height=<height> - Height of window in pixels. Minimum 480
##### Default: Height=480
#Height=480

##### Unshifted F-Key Usage
##### FKeySpells  - Use unshifted F-keys for spells
##### FKeyWeapons - Use unshifted F-keys for weapons
##### FKeyGear    - Use unshifted F-keys for gear
##### FKeyMacros  - Use unshifted F-keys for macros
##### Default: FKeySpells
#FKeySpells
#FKeyWeapons
#FKeyGear
#FKeyMacros

